{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="manifest" href="{% static 'manifest_prof.json' %}" crossorigin="use-credentials">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestion d'Appel{% endblock %}</title>
    <style>
        nav { background: #333; color: white; padding: 1rem; display: flex; gap: 20px; }
        nav a { color: white; text-decoration: none; }
        .container { padding: 20px; }
    </style>
</head>
<body>

    <nav>
        <a href="{% url 'dashboard' %}">Tableau de bord</a>
        
        {% if user.is_authenticated %}
            <a href="{% url 'deconnexion_enseignant' %}" style="margin-left: auto; color: #ff6666;">Déconnexion ({{ user.username }})</a>
        {% else %}
            <a href="{% url 'connexion_enseignant' %}" style="margin-left: auto;">Connexion</a>
        {% endif %}
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
